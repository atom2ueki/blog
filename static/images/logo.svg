<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer square, no fill -->
  <rect x="16" y="16" width="480" height="480" rx="8" fill="none" stroke="#a1b56c" stroke-width="12"/>

  <!-- Cross lines -->
  <line x1="256" y1="16" x2="256" y2="496" stroke="#a1b56c" stroke-width="12"/>
  <line x1="16" y1="256" x2="496" y2="256" stroke="#a1b56c" stroke-width="12"/>

  <!-- Letters centered in each quadrant -->
  <text x="136" y="136" fill="#a1b56c"
        font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="120"
        text-anchor="middle" dominant-baseline="central">N</text>

  <text x="376" y="136" fill="#a1b56c"
        font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="120"
        text-anchor="middle" dominant-baseline="central">S</text>

  <text x="136" y="376" fill="#a1b56c"
        font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="120"
        text-anchor="middle" dominant-baseline="central">F</text>

  <text x="376" y="376" fill="#a1b56c"
        font-family="SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="120"
        text-anchor="middle" dominant-baseline="central">E</text>
</svg>
